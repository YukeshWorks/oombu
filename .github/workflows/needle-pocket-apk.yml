name: Build Needle Pocket APK

on:
  push:
    branches: [main]
    paths:
      - 'needle-pocket/**'
      - '.github/workflows/needle-pocket-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download official Needle 3 ARM64 engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p needle-pocket/app/src/main/cpp/vendor/arm64-v8a
          BASE='https://huggingface.co/Cactus-Compute/needle3/resolve/d6c7d6a2e9655505e0f8e23339356dd1705900eb/android-arm64'
          curl --fail --location --retry 3 --retry-delay 2 "$BASE/libneedle.a" -o needle-pocket/app/src/main/cpp/vendor/arm64-v8a/libneedle.a
          curl --fail --location --retry 3 --retry-delay 2 "$BASE/needle.h" -o needle-pocket/app/src/main/cpp/vendor/arm64-v8a/needle.h
          test "$(wc -c < needle-pocket/app/src/main/cpp/vendor/arm64-v8a/libneedle.a)" -gt 1000000
          test "$(wc -c < needle-pocket/app/src/main/cpp/vendor/arm64-v8a/needle.h)" -gt 1000

      - name: Build debug APK
        working-directory: needle-pocket
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: needle-pocket-debug-apk
          path: needle-pocket/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30