name: Build Needle Pocket APK

on:
  push:
    branches: [main]
    paths:
      - 'needle-pocket/**'
      - '.github/workflows/needle-pocket-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download official Needle 3 ARM64 engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p needle-pocket/app/src/main/cpp/vendor/arm64-v8a
          BASE='https://huggingface.co/Cactus-Compute/needle3/resolve/8480f92eecabe4a50a3e58a46edd6aa11d71fe17/android-arm64'
          curl --fail --location --retry 3 --retry-delay 2 "$BASE/libneedle.a" -o needle-pocket/app/src/main/cpp/vendor/arm64-v8a/libneedle.a
          curl --fail --location --retry 3 --retry-delay 2 "$BASE/needle.h" -o needle-pocket/app/src/main/cpp/vendor/arm64-v8a/needle.h
          test "$(wc -c < needle-pocket/app/src/main/cpp/vendor/arm64-v8a/libneedle.a)" -gt 1000000
          test "$(wc -c < needle-pocket/app/src/main/cpp/vendor/arm64-v8a/needle.h)" -gt 1000

      - name: Package Android C++ runtime
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          RUNTIME="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          test -f "$RUNTIME"
          mkdir -p needle-pocket/app/src/main/jniLibs/arm64-v8a
          cp "$RUNTIME" needle-pocket/app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          ls -lh needle-pocket/app/src/main/jniLibs/arm64-v8a/libc++_shared.so

      - name: Build debug APK
        working-directory: needle-pocket
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: needle-pocket-debug-apk
          path: needle-pocket/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30